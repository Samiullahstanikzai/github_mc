name: Storefront 1000044056
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Hydrogen storefront
        id: storefront
        run: |
          if [ -f package.json ] && [ -f package-lock.json ] && grep -q '"@shopify/hydrogen"' package.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup node.js
        if: steps.storefront.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        if: steps.storefront.outputs.enabled == 'true'
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        if: steps.storefront.outputs.enabled == 'true'
        run: npm ci

      - name: Build and Publish to Oxygen
        if: steps.storefront.outputs.enabled == 'true'
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000044056 }}

      - name: Skip deploy for non-Hydrogen repo
        if: steps.storefront.outputs.enabled != 'true'
        run: echo "Skipping Oxygen deployment because this repository does not contain a Hydrogen storefront with an npm lockfile."
